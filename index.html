<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Família Ótica - Início</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
    }

    header {
      background-color: #ff6600;
      color: #fff;
      padding: 30px 20px;
      text-align: center;
    }

    nav {
      background: #fff;
      padding: 10px 0;
      text-align: center;
      border-bottom: 2px solid #ff6600;
    }

    nav a {
      color: #ff6600;
      margin: 0 15px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    section {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
      text-align: center;
    }

    .carousel {
      max-width: 600px;
      margin: auto;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .carousel img {
      width: 100%;
      height: auto;
      display: block;
    }

    footer {
      background: #000;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

    .footer-links a {
      color: #fff;
      text-decoration: none;
      margin: 0 10px;
    }

    /* Controles do carrossel */
    .carousel-controls {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .carousel:hover .carousel-controls {
      opacity: 1;
    }

    .carousel-button {
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: #fff;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Família Ótica</h1>
    <p>Especialistas em visão e bem-estar visual</p>
  </header>

  <nav>
    <a href="index.html">Início</a>
    <a href="sobre.html">Sobre</a>
    <a href="cuidados.html">Cuidados Visuais</a>
    <a href="lentes.html">Lentes</a>
    <a href="promocoes.html">Promoções</a>
    <a href="contato.html">Contato</a>
  </nav>

  <section>
    <div class="carousel" id="carousel">
      <img id="carousel-img" src="img/Imagem1.jpg" alt="Imagem 1">
      <div class="carousel-controls">
        <button class="carousel-button" onclick="changeSlide(-1)">&#10094;</button>
        <button class="carousel-button" onclick="changeSlide(1)">&#10095;</button>
      </div>
    </div>
  </section>

  <!-- Música de fundo -->
  <audio autoplay loop>
  <source src="audio/musica.mp3" type="audio/mp3">
  Seu navegador não suporta áudio.
</audio>

  <footer>
    <div class="footer-links">
      <a href="index.html">Início</a> |
      <a href="contato.html">Contato</a> |
      <a href="promocoes.html">Promoções</a>
    </div>
    <p>&copy; 2025 Família Ótica. Todos os direitos reservados.</p>
  </footer>

  <script>
    const images = [
      "img/Imagem1.jpg",
      "img/Imagem2.jpg",
      "img/Imagem3.jpg",
      "img/Imagem4.jpg",
      "img/Imagem5.jpg",
      "img/Imagem6.jpg"
    ];
    let current = 0;

    function changeSlide(direction) {
      current = (current + direction + images.length) % images.length;
      document.getElementById('carousel-img').src = images[current];
    }

    setInterval(() => changeSlide(1), 4000); // troca automática
  </script>

</body>
</html>
