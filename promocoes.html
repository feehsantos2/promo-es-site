<!DOCTYPE html>

  <title>Promoções | Família Ótica</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;

    header {
      background-color: #ff6a00;
      color: #fff;
      padding: 1rem;

    }

      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

      height: auto;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .promo-video {
      width: 100%;
      height: auto;
      margin-bottom: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    footer {

    <img src="img/Imagem3.jpg" alt="Promoção leve 3" class="promo-image" />
